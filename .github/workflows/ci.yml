name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres descartável para os testes de integração (tests/integration).
    services:
      postgres:
        image: postgres:17
        env:
          # Banco descartável, só existe dentro deste job.
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Inclui os testes de integração; sem TEST_DATABASE_URL eles falham na CI (não pulam).
      - run: pytest -W error -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        # O build exige as variáveis (CSP e site). Valores falsos: nenhum segredo na CI.
        env:
          VITE_API_URL: http://127.0.0.1:9999
          VITE_SUPABASE_URL: https://e2e-ref.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e
      # E2E com a API simulada (sem backend nem Google). Só o Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7
