[project]
name = "checafatosrr-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: precisa de Postgres real (TEST_DATABASE_URL); roda na CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101: assert é o idioma do pytest. S105/S106: segredos fictícios usados só nos testes.
"tests/**" = ["S101", "S105", "S106"]
