# Conjunto de avaliação do ChecaFatosRR (pós-eleição, fase "combate à desinformação").
#
# CANDIDATOS: nada aqui é gabarito ainda. Cada caso só entra na avaliação quando alguém
# conferir na agência e preencher:
#   resultado_esperado     verdadeiro | falso | enganoso | fora_de_contexto | nao_verificavel
#                          | checagem_de_agencia (para link_agencia)
#   agencia_esperada       opcional (ex.: Aos Fatos)
#   url_checagem_esperada  opcional; com ela o relatório mede "checagem certa encontrada"
#   fonte_do_gabarito      link (ou referência) que sustenta o gabarito
#   rotulado_por           nome de quem conferiu (no lugar de PENDENTE)
#   data                   dia da conferência (AAAA-MM-DD)
#
# Os comentários "candidato:" dizem de onde o caso veio (Fact Check API, 10 consultas em
# 26/10/2026) para facilitar a conferência; NÃO são o gabarito. Política vigente da
# plataforma: "verdadeiro" só com checagem de agência que corrobore; sem ela, o esperado
# costuma ser nao_verificavel. Nunca invente URL: entrada "PREENCHER" = escolher o link.

